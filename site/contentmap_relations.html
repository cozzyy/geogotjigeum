<style>

  .btn:hover{ background:#262c38; }
  .btn.btn-primary{ border-color:transparent; background:#e0603a; color:#fff; }
  .card{ border-radius:10px; padding:12px; background:#1e222b; border:1px solid #2b303b; }
  .text-small{ font-size:11.8px; }
  .text-muted{ color:#9aa4b2; }
  #story-relations{ width:100%; }
  #story-relations .viz-controls{ display:flex; flex-wrap:wrap; align-items:flex-start; gap:8px; margin-bottom:.6rem; }
  #story-relations .other-works-panel{ display:flex; flex-wrap:wrap; gap:8px; width:100%; margin-top:4px; padding:10px; border:1px solid #2b303b; border-radius:10px; background:#1a1e27; max-height:260px; overflow-y:auto; }
  #story-relations .other-works-panel[hidden]{ display:none; }
  #story-relations #other-works-toggle{ color:#9aa4b2; }
  #story-relations .viz-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-start; gap:1rem; margin-bottom:.6rem; color:#9aa4b2; }
  #story-relations .legend{ display:inline-block; width:1.4rem; height:3px; margin-right:.3rem; vertical-align:middle; }
  #story-relations .legend.family{ background:#e0603a; }
  #story-relations .legend.ally{ background:#f3883b; }
  #story-relations .legend.conflict{ background:#ff5c56; }
  #story-relations .legend.guide{ background:#9b79ec; }
  #story-relations #relation-detail{ margin-bottom:.6rem; padding:.6rem .8rem; }
  #story-relations #relation-canvas{ display:block; width:100%; height:auto; overflow:visible; }
  #story-relations .group-box{ fill:rgba(255,255,255,.04); stroke:#2b303b; stroke-width:1; }
  #story-relations .group-label{ fill:#eef1f5; font-weight:600; }
  #story-relations .node-card{ fill:#1e222b; stroke:#2b303b; stroke-width:1; cursor:pointer; }
  #story-relations .node-card:hover, #story-relations .node-card:focus{ stroke:#5a6577; stroke-width:2; }
  #story-relations .node-card.selected{ stroke:#e0603a; stroke-width:3; }
  #story-relations .node-card.dim, #story-relations .edge.dim, #story-relations .edge-label.dim{ opacity:.12; }
  #story-relations .node-name{ fill:#eef1f5; font-weight:700; pointer-events:none; }
  #story-relations .node-ja, #story-relations .node-role{ fill:#9aa4b2; pointer-events:none; }
  #story-relations .avatar{ fill:rgba(58,124,224,.18); stroke:#2b303b; pointer-events:none; }
  #story-relations .avatar-text{ fill:#eef1f5; font-weight:700; text-anchor:middle; pointer-events:none; }
  #story-relations .edge{ fill:none; stroke-width:2; opacity:.8; }
  #story-relations .edge.family{ stroke:#e0603a; }
  #story-relations .edge.ally{ stroke:#f3883b; }
  #story-relations .edge.conflict{ stroke:#ff5c56; }
  #story-relations .edge.guide{ stroke:#9b79ec; stroke-dasharray:5 3; }
  #story-relations .edge-label{ fill:#eef1f5; paint-order:stroke; stroke:#171a21; stroke-width:4; stroke-linejoin:round; font-size:10px; }

  /* ---- 대망 시대별 관계 변화(타임라인 애니메이션) ---- */
  #timeline-strip{ display:none; gap:6px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:2px; }
  #timeline-strip .btn{ flex-shrink:0; font-weight:600; }
  #timeline-strip .btn.active{ border-color:transparent; background:#e0603a; color:#fff; }
  #timeline-caption{ display:none; }
  #timeline-caption .yr{ color:#f3883b; font-weight:800; margin-right:6px; }
  .tl-node-name{ fill:#eef1f5; font-weight:700; text-anchor:middle; pointer-events:none; }
  .tl-node-sub{ fill:#9aa4b2; text-anchor:middle; pointer-events:none; }
  .tl-axis-label{ fill:#5a6577; font-size:10.5px; }
  .tl-axis-line{ stroke:#2b303b; stroke-width:1; stroke-dasharray:3 4; }
  .tl-edge{ fill:none; stroke-width:2; opacity:.85; transition:opacity .3s ease; }
  .tl-edge.strained{ stroke:#ff5c56; stroke-dasharray:6 4; }
  .tl-node-circle{ transition:cx 1.1s cubic-bezier(.4,0,.2,1),cy 1.1s cubic-bezier(.4,0,.2,1),r 1.1s ease,opacity .8s ease; }
  .tl-edge{ transition:d 1.1s cubic-bezier(.4,0,.2,1),opacity .6s ease; }
</style>

  let tlIdx = 0;

  function tlEdgePairs(frame){
    const ids = Object.keys(frame.pos);
    const pairs = [];
    if (ids.includes("nobunaga")) pairs.push(["nobunaga","ieyasu"]);
    if (ids.includes("hideyoshi")) pairs.push(["hideyoshi","ieyasu"]);
    if (ids.includes("mitsunari")) pairs.push(["mitsunari","ieyasu"]);
    if (ids.includes("tadakatsu")) pairs.push(["tadakatsu","ieyasu"]);
    if (ids.includes("masanobu")) pairs.push(["masanobu","ieyasu"]);
    return pairs;
  }

  function drawTimelineFrame(idx){
    tlIdx = idx;
    const frame = daemangTimeline[idx];
    svg.setAttribute("viewBox", `0 0 ${TL_W} ${TL_H}`);
    groupLayer.replaceChildren(); edgeLayer.replaceChildren(); nodeLayer.replaceChildren();

    let defs = svg.querySelector("defs");
    if (!defs){ defs = el("defs",{}); svg.insertBefore(defs, svg.firstChild); }
    defs.replaceChildren();
    Object.entries(tlChar).forEach(([id,c])=>{
      const grad = el("radialGradient",{id:"tlg-"+id,cx:"38%",cy:"32%",r:"75%"});
      const s1 = el("stop",{offset:"0%","stop-color":c.color,"stop-opacity":"0.95"});
      const s2 = el("stop",{offset:"100%","stop-color":c.color,"stop-opacity":"0.55"});
      grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad);
    });

    groupLayer.appendChild(el("line",{x1:TL_CX,y1:14,x2:TL_CX,y2:TL_H-30,class:"tl-axis-line"}));
    const axTop=el("text",{x:14,y:20,class:"tl-axis-label"}); axTop.textContent="↑ 권력·영향력 강함"; groupLayer.appendChild(axTop);
    const axBot=el("text",{x:14,y:TL_H-16,class:"tl-axis-label"}); axBot.textContent="↓ 권력·영향력 약함"; groupLayer.appendChild(axBot);
    const axL=el("text",{x:14,y:TL_H/2,class:"tl-axis-label"}); axL.textContent="← 이에야스와 대립·거리"; groupLayer.appendChild(axL);
    const axR=el("text",{x:TL_W-14,y:TL_H/2,class:"tl-axis-label","text-anchor":"end"}); axR.textContent="이에야스와 우호·밀착 →"; groupLayer.appendChild(axR);

    tlEdgePairs(frame).forEach(([a,b])=>{
      const pa=frame.pos[a], pb=frame.pos[b];
      if (!pa||!pb) return;
      const [x1,y1]=pa, [x2,y2]=pb;
      const bend=Math.max(20,Math.abs(x2-x1)*.25);
      const key1=a+"-"+b, key2=b+"-"+a;
      const strained=(frame.strain||[]).includes(key1)||(frame.strain||[]).includes(key2);
      const faded=(frame.fade||[]).includes(a)||(frame.fade||[]).includes(b);
      const path=el("path",{d:`M${x1},${y1} C${x1+bend},${y1} ${x2-bend},${y2} ${x2},${y2}`,class:"tl-edge"+(strained?" strained":""),style:`opacity:${faded?0.15:0.85}`});
      edgeLayer.appendChild(path);
    });

    Object.entries(frame.pos).forEach(([id,p])=>{
      const [x,y,r]=p;
      const c=tlChar[id];
      const faded=(frame.fade||[]).includes(id);
      const g=el("g",{});
      const circle=el("circle",{cx:x,cy:y,r:r,fill:`url(#tlg-${id})`,stroke:c.color,"stroke-width":"1.5",class:"tl-node-circle",style:`opacity:${faded?0.35:1}`});
      g.appendChild(circle);
      const name=el("text",{x:x,y:y+r+15,class:"tl-node-name","font-size":c.small?"10.5":"12.5",style:`opacity:${faded?0.4:1}`});
      name.textContent=c.label; g.appendChild(name);
      const sub=el("text",{x:x,y:y+r+27,class:"tl-node-sub","font-size":"9.5",style:`opacity:${faded?0.4:1}`});
      sub.textContent=c.sub; g.appendChild(sub);
      nodeLayer.appendChild(g);
    });

    root.querySelectorAll("#timeline-strip .btn").forEach((b,i)=>b.classList.toggle("active", i===idx));
    const capEl = root.querySelector("#timeline-caption");
    capEl.innerHTML = `<span class="yr">${frame.year}</span>${frame.title} — <span class="text-muted">${frame.caption}</span>`;
  }

  function buildTimelineStrip(){
    const strip = root.querySelector("#timeline-strip");

      b.textContent=f.year;
      b.addEventListener("click",()=>drawTimelineFrame(i));
      strip.appendChild(b);
    });
  }

  let selected = null;
  const el = (name, attrs = {}) => {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k, v));
    return node;
  };

  function layout(dataset, mobile) {
    const groupCount = dataset.groups.length;
    const cols = mobile ? 1 : (groupCount > 4 ? 3 : 2);
    const groupW = mobile ? 300 : 370;
    const gapX = mobile ? 0 : 25;
    const cardW = mobile ? 132 : 160;
    const cardH = 56;
    const gapY = 12;
    const result = { nodes:{}, groups:[] };
    let yCursor = 12;
    dataset.groups.forEach((g, gi) => {
      const members = dataset.nodes.filter(n => n[4] === g.id);
      const groupCol = mobile ? 0 : gi % cols;
      const groupRow = mobile ? gi : Math.floor(gi / cols);
      const cardsPerRow = mobile ? 2 : 2;
      const rows = Math.ceil(members.length / cardsPerRow);
      const gh = 48 + rows * (cardH + gapY);
      let gx, gy;
      if (mobile) {
        gx = 10; gy = yCursor; yCursor += gh + 18;
      } else {
        gx = 10 + groupCol * (groupW + gapX);
        const heights = [];
        for (let r=0; r<groupRow; r++) {
          const groupRowItems = dataset.groups.slice(r*cols, r*cols+cols);
          const maxMembers = Math.max(...groupRowItems.map(x => dataset.nodes.filter(n => n[4] === x.id).length));
          heights.push(48 + Math.ceil(maxMembers/2)*(cardH+gapY) + 18);
        }
        gy = 12 + heights.reduce((a,b)=>a+b,0);
      }
      result.groups.push({ ...g, x:gx, y:gy, w:groupW, h:gh });
      members.forEach((n, i) => {
        const col = i % cardsPerRow;
        const row = Math.floor(i / cardsPerRow);
        result.nodes[n[0]] = { x:gx+14+col*(cardW+16), y:gy+36+row*(cardH+gapY), w:cardW, h:cardH };
      });
    });
    const width = mobile ? 320 : cols*groupW+(cols-1)*gapX+20;
    const height = mobile ? yCursor : Math.max(...result.groups.map(g=>g.y+g.h))+16;
    return { ...result, width, height };
  }

  function syncButtons(){
    root.querySelectorAll("#other-works-panel button[data-work]").forEach(b=>{
      const active = b.dataset.work === current;
      b.classList.toggle("btn-primary", active);
      b.setAttribute("aria-pressed", String(active));
    });
    const chip = root.querySelector("#current-work-chip");
    if (chip){
      const activeBtn = Array.from(root.querySelectorAll("#other-works-panel button[data-work]")).find(b=>b.dataset.work===current);
      chip.textContent = activeBtn ? activeBtn.textContent : current;
    }
  }

  function setOtherWorksOpen(open){
    const panel = root.querySelector("#other-works-panel");
    const toggle = root.querySelector("#other-works-toggle");
    if (!panel || !toggle) return;
    panel.hidden = !open;
    toggle.setAttribute("aria-expanded", String(open));
    toggle.textContent = open ? "접기 ▲" : "다른 작품 보기 ▾";
  }

  function showTimelineMode(show){
    root.querySelector("#timeline-strip").style.display = show ? "flex" : "none";
    root.querySelector("#timeline-caption").style.display = show ? "block" : "none";
    root.querySelector("#relation-detail").style.display = show ? "none" : "block";
    root.querySelector(".viz-row").style.display = show ? "none" : "flex";
  }

  function draw() {
    if (current === "daemang-timeline"){
      showTimelineMode(true);
      buildTimelineStrip();
      drawTimelineFrame(0);
      syncButtons();
      return;
    }
    showTimelineMode(false);
    const dataset = data[current];
    const mobile = root.getBoundingClientRect().width < 560;
    const pos = layout(dataset, mobile);
    svg.setAttribute("viewBox", `0 0 ${pos.width} ${pos.height}`);
    groupLayer.replaceChildren(); edgeLayer.replaceChildren(); nodeLayer.replaceChildren();

    pos.groups.forEach(g => {
      groupLayer.appendChild(el("rect",{x:g.x,y:g.y,width:g.w,height:g.h,rx:8,class:"group-box"}));
      const label = el("text",{x:g.x+12,y:g.y+22,class:"group-label","font-size":"13"});
      label.textContent = g.label; groupLayer.appendChild(label);
    });

    dataset.edges.forEach(([a,b,label,type]) => {
      const p1=pos.nodes[a], p2=pos.nodes[b];
      if (!p1 || !p2) return;
      const x1=p1.x+p1.w/2, y1=p1.y+p1.h/2, x2=p2.x+p2.w/2, y2=p2.y+p2.h/2;
      const bend=Math.max(24,Math.abs(x2-x1)*.22);
      const path=el("path",{d:`M${x1},${y1} C${x1+bend},${y1} ${x2-bend},${y2} ${x2},${y2}`,class:`edge ${type}`,"data-a":a,"data-b":b});
      edgeLayer.appendChild(path);
      if (!mobile || Math.abs(y2-y1)<180) {
        const text=el("text",{x:(x1+x2)/2,y:(y1+y2)/2-4,class:"edge-label","font-size":"10","text-anchor":"middle","data-a":a,"data-b":b});
        text.textContent=label; edgeLayer.appendChild(text);
      }
    });

    dataset.nodes.forEach(([id,ko,ja,role]) => {
      const p=pos.nodes[id];
      const g=el("g",{"data-id":id,role:"button","aria-label":`${ko}, ${role}`});
      const card=el("rect",{x:p.x,y:p.y,width:p.w,height:p.h,rx:6,class:"node-card"});
      g.appendChild(card);
      const avatar=el("circle",{cx:p.x+19,cy:p.y+20,r:12,class:"avatar"}); g.appendChild(avatar);
      const initial=el("text",{x:p.x+19,y:p.y+24,class:"avatar-text","font-size":"11"});
      initial.textContent=ko.slice(0,1); g.appendChild(initial);
      const name=el("text",{x:p.x+37,y:p.y+17,class:"node-name","font-size":"11"});
      name.textContent=ko.length>12?ko.slice(0,12)+"…":ko; g.appendChild(name);
      const jat=el("text",{x:p.x+37,y:p.y+31,class:"node-ja","font-size":"9"});
      jat.textContent=ja.length>13?ja.slice(0,13)+"…":ja; g.appendChild(jat);
      const rt=el("text",{x:p.x+10,y:p.y+48,class:"node-role","font-size":"9"});
      rt.textContent=role.length>16?role.slice(0,16)+"…":role; g.appendChild(rt);
      g.addEventListener("click",()=>selectNode(id));
      nodeLayer.appendChild(g);
    });
    selected=null;
    detail.textContent = dataset.title + " — 인물 카드를 선택하면 연결 관계가 강조됩니다.";
    syncButtons();
  }

  function selectNode(id) {
    const dataset=data[current];
    selected = selected===id ? null : id;
    const connected=new Set(selected?[selected]:[]);
    const relations=[];
    if (selected) dataset.edges.forEach(([a,b,label]) => {
      if(a===selected||b===selected){ connected.add(a); connected.add(b); relations.push(`${dataset.nodes.find(n=>n[0]===a)[1]} ↔ ${dataset.nodes.find(n=>n[0]===b)[1]}: ${label}`); }
    });
    nodeLayer.querySelectorAll("g[data-id]").forEach(g=>{
      const card=g.querySelector(".node-card");
      card.classList.toggle("selected",g.dataset.id===selected);
      card.classList.toggle("dim",Boolean(selected&&!connected.has(g.dataset.id)));
    });
    edgeLayer.querySelectorAll("[data-a]").forEach(e=>e.classList.toggle("dim",Boolean(selected&&e.dataset.a!==selected&&e.dataset.b!==selected)));
    if (!selected) detail.textContent=data[current].title+" — 인물 카드를 선택하면 연결 관계가 강조됩니다.";
    else {
      const node=dataset.nodes.find(n=>n[0]===selected);
      detail.textContent=`${node[1]} (${node[2]}) — ${relations.join(" · ") || "표시된 직접 관계 없음"}`;
    }
  }

  root.querySelectorAll("#other-works-panel button[data-work]").forEach(button=>{
    button.addEventListener("click",()=>{
      current=button.dataset.work;
      draw();
      setOtherWorksOpen(false);
    });
  });
  root.querySelector("#other-works-toggle").addEventListener("click",()=>{
    const panel = root.querySelector("#other-works-panel");
    setOtherWorksOpen(Boolean(panel && panel.hidden));
  });
  root.querySelector("#current-work-chip").addEventListener("click",()=>{
    const panel = root.querySelector("#other-works-panel");
    setOtherWorksOpen(Boolean(panel && panel.hidden));
  });
  let lastMobile=null;
  new ResizeObserver(()=>{
    const mobile=root.getBoundingClientRect().width<560;
    if(mobile!==lastMobile){lastMobile=mobile;draw();}
  }).observe(root);
  draw();
})();
</script>
</body>
</html>
