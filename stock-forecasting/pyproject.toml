[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geogotjigeum-stock-forecasting"
version = "0.1.0"
description = "Experimental stock forecasting MVP for geogotjigeum"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "yfinance>=0.2.40",
  "pykrx>=1.2.9",
  "streamlit>=1.36",
]

[project.scripts]
stock-forecast = "stock_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
