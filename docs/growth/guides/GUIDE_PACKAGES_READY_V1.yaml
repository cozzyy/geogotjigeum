      eyebrow: "白夜行 · 聖地巡礼"
      heading: "原作の『舞台』とドラマの『ロケ地』は、別々に歩こう"
      summary: "布施は原作の物語を感じる大阪の舞台。一方、水海道駅は2006年TBS版の撮影地。約500km離れた二つを無理に1日コースにせず、2つの巡礼レイヤーとして分ける。"
