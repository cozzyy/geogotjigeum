packages:
  - guide_id: breakingbad-albuquerque-v1
    status: PLANNER_READY
    primary_locale: ko
    work_id: breakingbad
    guide_type: LINEAR_ROUTE
    slug_candidate: /guides/breaking-bad-albuquerque/
    seo:
      title: "브레이킹 배드 앨버커키 촬영지 하루 코스 | 그곳지금"
      meta_description: "Twisters, Java Joe's, A1A 세차장을 잇는 브레이킹 배드 앨버커키 셀프 가이드. 개인 주택 방문 없이 핵심 촬영지 3곳을 따라간다."
      target_queries: ["브레이킹 배드 앨버커키 촬영지", "breaking bad filming locations albuquerque", "breaking bad self guided tour"]
    hero:
      eyebrow: "Breaking Bad · Albuquerque"
      heading: "브레이킹 배드, 사유지 말고 실제 들어가 볼 수 있는 3곳"
      summary: "월터의 집은 뺐다. 지금도 운영되는 식당·카페·세차장을 남쪽에서 북동쪽으로 이어 보는 셀프 가이드다."
      time_label: "하루 여유 있게"
      transport_label: "자동차 권장 · 당일 교통 확인"
      hero_asset: /assets/scenes/breakingbad/breakingbad-scene-01.svg
    before_you_go:
      - "실시간 최적 경로가 아니다. 출발 전 지도에서 당일 교통과 영업 상태를 확인한다."
      - "개인 주택은 v1 핵심 Stop에서 제외한다."
      - "영업 중인 업장의 일반 고객과 직원 이용을 방해하지 않는다."
    segments:
      - segment_id: abq-core
        title: "앨버커키 핵심 촬영지 3곳"
        summary: "South Valley → Downtown → Snow Heights 흐름으로 이동한다."
        stops:
          - order: 1
            stop_id: bb-lospollos
            canonical_location_id: lospollos
            canonical_source: site/contentmap_breakingbad_locations.js
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: CORE
            scene_id: breakingbad-scene-01
            asset_path: /assets/scenes/breakingbad/breakingbad-scene-01.svg
            heading: "Los Pollos Hermanos, 현실에서는 Twisters"
            body: "구스 프링의 치킨집에 쓰인 실제 Twisters 지점. 세트가 아니라 지금도 운영되는 식당이다."
            why_this_stop: "작품 속 장소를 가장 쉽게 알아볼 수 있고 개인 주택이 아니라는 점에서 출발점으로 좋다."
            visit_note: "방문 직전 공식 매장 정보에서 운영 여부를 확인하고 일반 고객처럼 이용한다."
            next_hint: "다음은 Downtown의 Java Joe's."
            current_status_source: "https://www.mytwisters.com/locations/"
            verified_at: 2026-09-01
          - order: 2
            stop_id: bb-tuco
            canonical_location_id: tuco_office
            canonical_source: site/contentmap_breakingbad_locations.js
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: CORE
            scene_id: breakingbad-scene-03
            asset_path: /assets/scenes/breakingbad/breakingbad-scene-03.svg
            heading: "투코의 본거지, 지금은 Java Joe's"
            body: "투코의 본거지로 등장한 건물은 현재 실제 카페로 운영된다. 화면의 긴장감과 평범한 현재가 강하게 대비된다."
            why_this_stop: "강렬한 장면의 기억과 동네 카페의 현재 모습이 겹치는 게 재미다."
            visit_note: "영업시간은 변동될 수 있으므로 방문 당일 확인한다."
            next_hint: "마지막은 Snow Heights의 A1A 세차장 촬영지."
            current_status_source: "https://joe.coffee/locations/nm/albuquerque/java-joe-s-albuquerque/"
            verified_at: 2026-09-01
          - order: 3
            stop_id: bb-carwash
            canonical_location_id: carwash
            canonical_source: site/contentmap_breakingbad_locations.js
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: CORE
            scene_id: breakingbad-scene-02
            asset_path: /assets/scenes/breakingbad/breakingbad-scene-02.svg
            heading: "A1A 세차장, 지금도 실제 세차장"
            body: "월터의 직장과 돈세탁 사업장으로 반복 등장한 장소. 현재도 실제 세차장으로 운영된다."
            why_this_stop: "범죄 드라마의 상징적인 공간이 지금도 평범한 생활시설이라는 점이 작품답다."
            visit_note: "시설 이용객과 직원 동선을 방해하지 않는다."
            next_hint: "코스 종료. 개인 주택을 추가 방문지로 자동 추천하지 않는다."
            current_status_source: "https://albuquerque.com/explore-albuquerque-the-breaking-bad-way/"
            verified_at: 2026-09-01
    related:
      work_id: breakingbad
      suggested_links: [WORK, PLACE, MAP]

