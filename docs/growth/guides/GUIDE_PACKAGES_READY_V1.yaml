packages:
  - guide_id: breakingbad-albuquerque-v1
    status: PLANNER_READY
    primary_locale: ko
    work_id: breakingbad
    guide_type: LINEAR_ROUTE
    slug_candidate: /guides/breaking-bad-albuquerque/
    seo:
      title: "브레이킹 배드 앨버커키 촬영지 하루 코스 | 그곳지금"
      meta_description: "로스 포요스 에르마노스(Twisters), 투코의 은신처(Java Joe's), A1A 세차장을 잇는 브레이킹 배드 앨버커키 셀프 가이드. 사유지 방문 없이 핵심 촬영지 3곳을 따라간다."
      target_queries:
        - "브레이킹 배드 앨버커키 촬영지"
        - "breaking bad filming locations albuquerque"
        - "breaking bad self guided tour"
    hero:
      eyebrow: "Breaking Bad · Albuquerque"
      heading: "브레이킹 배드, 사유지 말고 진짜 들어가 볼 수 있는 3곳"
      summary: "월터의 집 앞에서 민폐 인증샷을 찍는 코스는 뺐다. 지금도 영업하는 식당·카페·세차장을 남쪽에서 북동쪽으로 이어 보는 셀프 가이드다."
      time_label: "하루 여유 있게"
      transport_label: "자동차 권장 · 실시간 교통에 따라 동선 변동"
      hero_asset: /assets/scenes/breakingbad/breakingbad-scene-01.svg
    before_you_go:
      - "이 코스는 실시간 최적 경로가 아니다. 출발 전 지도에서 당일 교통과 영업 상태를 다시 확인한다."
      - "월터 화이트의 집 등 개인 주택은 v1 핵심 Stop에서 제외한다."
      - "영업 중인 업장에서는 일반 고객과 직원의 이용을 방해하지 않는다."
    segments:
      - segment_id: abq-core
        title: "앨버커키 핵심 촬영지 3곳"
        summary: "South Valley의 Twisters에서 시작해 Downtown의 Java Joe's를 거쳐 Snow Heights의 세차장으로 이동하는 단순한 남→북동 흐름이다."
        stops:
          - order: 1
            stop_id: bb-lospollos
            canonical_location_id: lospollos
            canonical_source: site/contentmap_breakingbad_locations.js
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: CORE
            scene_id: breakingbad-scene-01
            asset_path: /assets/scenes/breakingbad/breakingbad-scene-01.svg
            heading: "Los Pollos Hermanos, 현실에서는 Twisters"
            body: "구스 프링의 치킨집 외관과 식당 장면에 쓰인 실제 Twisters 지점이다. 세트가 아니라 지금도 영업하는 식당이라 화면과 현실이 가장 자연스럽게 겹친다."
            why_this_stop: "브레이킹 배드 팬 코스를 시작하기 좋은 이유는 설명이 필요 없을 정도로 알아보기 쉽고, 사유지가 아니라 정상 영업 중인 장소라는 점이다."
            visit_note: "현재 영업 지점. 방문 직전 공식 매장 정보에서 운영 여부를 확인하고 일반 고객처럼 이용한다."
            next_hint: "다음은 Downtown의 Java Joe's. 실시간 교통은 사용자가 지도에서 확인한다."
            current_status_source: "https://www.mytwisters.com/locations/"
            verified_at: 2026-09-01
          - order: 2
            stop_id: bb-tuco
            canonical_location_id: tuco_office
            canonical_source: site/contentmap_breakingbad_locations.js
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: CORE
            scene_id: breakingbad-scene-03
            asset_path: /assets/scenes/breakingbad/breakingbad-scene-03.svg
            heading: "투코의 본거지, 지금은 Java Joe's"
            body: "월터가 투코와 맞부딪치며 돌아갈 수 없는 선을 넘는 장면의 건물. 현재는 실제 카페 Java Joe's로 운영돼 화면의 긴장감과 평범한 현재가 강하게 대비된다."
            why_this_stop: "팬에게는 폭발적인 장면의 기억이 남아 있는데 현실에서는 커피를 마실 수 있는 동네 카페다. 그 간극 자체가 재미다."
            visit_note: "현재 카페 운영이 확인된다. 영업시간은 변동될 수 있으므로 방문 당일 확인한다."
            next_hint: "마지막은 Snow Heights의 A1A 세차장 촬영지."
            current_status_source: "https://joe.coffee/locations/nm/albuquerque/java-joe-s-albuquerque/"
            verified_at: 2026-09-01
          - order: 3
            stop_id: bb-carwash
            canonical_location_id: carwash
            canonical_source: site/contentmap_breakingbad_locations.js
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: CORE
            scene_id: breakingbad-scene-02
            asset_path: /assets/scenes/breakingbad/breakingbad-scene-02.svg
            heading: "A1A 세차장, 지금도 실제 세차장"
            body: "월터의 직장과 이후 돈세탁 사업장으로 반복 등장한 상업시설. 현재도 Mister Car Wash로 운영되는 실제 세차장이다."
            why_this_stop: "범죄 드라마의 상징적인 공간이 지금도 평범한 생활시설이라는 점에서 브레이킹 배드다운 마무리다."
            visit_note: "현재 상업시설로 운영 중. 시설 이용객과 직원 동선을 방해하지 않는다."
            next_hint: "코스 종료. 다른 개인 주택을 추가 방문지로 자동 추천하지 않는다."
            current_status_source: "https://albuquerque.com/explore-albuquerque-the-breaking-bad-way/"
            verified_at: 2026-09-01
    related:
      work_id: breakingbad
      suggested_links: [WORK, PLACE, MAP]

  - guide_id: poksshak-jeju-v1
    status: PLANNER_READY
    primary_locale: ko
    work_id: poksshak
    guide_type: LINEAR_ROUTE
    slug_candidate: /guides/poksshak-jeju/
    seo:
      title: "폭싹 속았수다 제주 촬영지 하루 코스 | 그곳지금"
      meta_description: "성산일출봉에서 김녕 바다를 거쳐 협재까지, 폭싹 속았수다의 제주 촬영지 3곳을 동쪽에서 서쪽으로 따라가는 팬 여행 코스. 작품 속 장면과 실제 제주를 함께 본다."
      target_queries:
        - "폭싹 속았수다 제주 촬영지"
        - "폭싹 속았수다 촬영지 코스"
        - "제주 드라마 촬영지 하루 코스"
    hero:
      eyebrow: "폭싹 속았수다 · Jeju"
      heading: "애순과 관식의 제주를 동쪽에서 서쪽까지"
      summary: "가까운 세 곳을 억지로 묶은 코스가 아니다. 성산에서 시작해 김녕을 지나 협재의 서쪽 바다로 끝나는 ‘제주 동→서 팬 코스’다. 하루 종일 천천히 움직일 사람에게 맞다."
      time_label: "하루 · 동→서 장거리 이동"
      transport_label: "자동차 권장 · 시간 빠듯하면 협재는 다음 날로 분리"
      hero_asset: /assets/scenes/poksshak/poksshak-scene-01.svg
    before_you_go:
      - "세 장소는 제주 전역에 퍼져 있어 짧은 반나절 코스가 아니다. 일정이 빠듯하면 성산+김녕만 묶고 협재를 별도 일정으로 둔다."
      - "성산일출봉의 관람시간·요금 등 변동 정보는 공식 관광정보를 방문 당일 확인한다."
      - "바다·어촌에서는 주민 생활과 자연환경을 방해하지 않는다."
    segments:
      - segment_id: jeju-east-to-west
        title: "성산 → 김녕 → 협재"
        summary: "동쪽의 성산에서 시작해 북동부 김녕을 거쳐 서쪽 협재로 이동한다. ‘최단거리’보다 드라마의 서로 다른 제주 풍경을 하루에 연결하는 데 목적이 있다."
        stops:
          - order: 1
            stop_id: pok-seongsan
            canonical_location_id: seongsan_ilchulbong
            canonical_source: site/contentmap_data.js#POKSSAK_LOCATIONS
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: CORE
            scene_id: poksshak-scene-01
            asset_path: /assets/scenes/poksshak/poksshak-scene-01.svg
            heading: "성산일출봉, 작품과 제주 풍경이 한 번에 겹치는 곳"
            body: "드라마의 제주 삶과 감정을 연결하는 대표 촬영 축. 작품을 몰라도 압도적인 장소라 첫 Stop으로 이해하기 쉽다."
            why_this_stop: "풍경 자체의 힘이 강해서 ‘촬영지라서만 가는 곳’이 아니다. 작품 팬과 일반 여행자 모두에게 시작점 역할을 한다."
            visit_note: "공식 관광지의 현재 관람정보를 방문 당일 확인한다."
            next_hint: "북서 방향으로 김녕 바다로 이동."
            current_status_source: "https://www.visitjeju.net/"
            verified_at: 2026-09-01
          - order: 2
            stop_id: pok-gimnyeong
            canonical_location_id: gimnyeong_beach
            canonical_source: site/contentmap_data.js#POKSSAK_LOCATIONS
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: CORE
            scene_id: poksshak-scene-02
            asset_path: /assets/scenes/poksshak/poksshak-scene-02.svg
            heading: "김녕 바다, 해녀의 시간까지 같이 보는 촬영지"
            body: "애순과 관식의 어린 시절과 어머니 세대 해녀의 삶을 떠올리게 하는 바다. 예쁜 해변이라는 설명만으로는 작품과의 연결을 놓치기 쉽다."
            why_this_stop: "폭싹 속았수다가 제주를 ‘배경’이 아니라 세대의 생활 공간으로 보여준다는 점을 가장 쉽게 느낄 수 있다."
            visit_note: "어촌·해변의 주민 생활을 존중하고 촬영을 위해 사유 공간이나 작업구역에 들어가지 않는다."
            next_hint: "시간과 체력이 충분하면 서쪽 협재까지 연장한다. 빠듯하면 여기서 East Core를 종료한다."
            current_status_source: "https://www.visitjeju.net/"
            verified_at: 2026-09-01
          - order: 3
            stop_id: pok-hyeopjae
            canonical_location_id: hyeopjae_beach
            canonical_source: site/contentmap_data.js#POKSSAK_LOCATIONS
            relationship: FILMED
            context_type: SCREEN_SCENE
            link_mode: MAP_OR_PLACE
            role: OPTIONAL_EXTENSION
            scene_id: poksshak-scene-03
            asset_path: /assets/scenes/poksshak/poksshak-scene-03.svg
            heading: "협재, 하루의 마지막을 다정한 바다로"
            body: "애순과 관식의 따뜻한 기억과 연결되는 서쪽 바다. 김녕에서 거리가 있기 때문에 필수 Stop이 아니라 충분한 하루 일정일 때만 이어가는 연장 구간으로 둔다."
            why_this_stop: "드라마의 거친 시간 뒤에 잠깐 숨을 돌리는 감정과 협재의 밝은 바다가 잘 맞는다."
            visit_note: "장거리 연장 Stop. 당일 교통·일몰·체력에 따라 과감히 생략할 수 있다."
            next_hint: "Guide 종료. 숙소 위치에 따라 역순 진행도 허용한다."
            current_status_source: "https://www.visitjeju.net/"
            verified_at: 2026-09-01
    related:
      work_id: poksshak
      suggested_links: [WORK, PLACE, MAP]

  - guide_id: byakuya-pilgrimage-v1
