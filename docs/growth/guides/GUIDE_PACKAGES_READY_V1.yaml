      heading: "애순과 관식의 제주를 동쪽에서 서쪽까지"
      summary: "성산에서 시작해 김녕을 지나 협재로 끝나는 제주 동→서 팬 코스. 하루 종일 천천히 움직일 사람에게 맞다."
      time_label: "하루 · 동→서 장거리 이동"
