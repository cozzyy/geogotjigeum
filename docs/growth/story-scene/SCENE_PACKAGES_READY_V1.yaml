    relationship: FILMED
    image_path: /assets/scenes/breakingbad/breakingbad-scene-03.svg
    image_type: original_illustration
    alt_ko: "투코의 사무실 촬영지로 쓰인 Java Joe's 건물을 표현한 에디토리얼 일러스트"
    fact_sources:
      - "site/contentmap_breakingbad_locations.js#tuco_office"
