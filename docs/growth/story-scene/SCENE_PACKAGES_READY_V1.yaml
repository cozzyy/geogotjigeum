packages:
  - scene_id: odyssey-scene-01
    work_id: odyssey
    context_type: SCREEN_SCENE
    source_location_id: nestors_cave
    link_mode: MAP_OR_PLACE
    scene_title_ko: "동굴 안에서 마주친 신화"
    scene_description_ko: "네스토르 동굴과 보이도킬리아 일대가 《The Odyssey》의 메세니아 촬영 축으로 쓰였다. 화면 속 신화의 동굴이 실제 절벽과 바다 위에 놓여 있다는 게 이 장면의 포인트다."
    relationship: FILMED
    image_path: /assets/scenes/odyssey/odyssey-scene-01.svg
    image_type: original_illustration
    alt_ko: "그리스 메세니아의 네스토르 동굴과 보이도킬리아 해안을 표현한 에디토리얼 일러스트"
    fact_sources:
      - "docs/growth/story-scene/SCENE_PACKAGE_RESEARCH_15_V1.md"
      - "site/contentmap_odyssey_locations.js#nestors_cave"
    image_source_url: internal
    license: original
    attribution: "그곳지금 기획"
    why_this_place_ko: "영화 장면 하나 보고 찾아갔다가 풍경에 한 번 더 놀라는 곳이다. 동굴 자체뿐 아니라 입구에서 내려다보는 보이도킬리아의 곡선까지 한 장면처럼 이어진다. ‘세트겠지’ 싶었던 공간이 실제 지형이라는 게 재미다."
    status: PLANNER_READY

  - scene_id: odyssey-scene-02
    work_id: odyssey
    context_type: SCREEN_SCENE
    source_location_id: voidokilia_beach
    link_mode: MAP_OR_PLACE
    scene_title_ko: "신화의 바다가 현실이 되는 보이도킬리아"
    scene_description_ko: "거의 완벽한 초승달 모양의 보이도킬리아 해변은 《The Odyssey》의 메세니아 촬영지 중 하나다. 바다와 모래의 형태 자체가 거대한 세트처럼 보인다."
    relationship: FILMED
    image_path: /assets/scenes/odyssey/odyssey-scene-02.svg
    image_type: original_illustration
    alt_ko: "초승달 모양의 보이도킬리아 해변을 표현한 에디토리얼 일러스트"
    fact_sources:
      - "docs/growth/story-scene/SCENE_PACKAGE_RESEARCH_15_V1.md"
      - "site/contentmap_odyssey_locations.js#voidokilia_beach"
    image_source_url: internal
    license: original
    attribution: "그곳지금 기획"
    why_this_place_ko: "위에서 보면 해변이 거의 기호처럼 휘어 있다. 네스토르 동굴과 같은 동선으로 이어져서 장소 하나를 보는 것보다 영화 속 공간 전체를 걷는 느낌을 만들기 좋다."
    status: PLANNER_READY

  - scene_id: odyssey-scene-03
    work_id: odyssey
    context_type: SCREEN_SCENE
    source_location_id: favignana_castle
    link_mode: MAP_OR_PLACE
    scene_title_ko: "이타카의 왕궁처럼 변한 섬 정상의 성채"
    scene_description_ko: "파비냐나 섬의 산타 카테리나 성채는 영화 속 고대 세계를 만드는 실제 로케이션으로 쓰였다. 화면의 왕궁과 현실의 오래된 요새가 겹치는 장소다."
    relationship: FILMED
    image_path: /assets/scenes/odyssey/odyssey-scene-03.svg
    image_type: original_illustration
    alt_ko: "이탈리아 파비냐나 섬 정상의 산타 카테리나 성채를 표현한 에디토리얼 일러스트"
    fact_sources:
      - "docs/growth/story-scene/SCENE_PACKAGE_RESEARCH_15_V1.md"
      - "site/contentmap_odyssey_locations.js#favignana_castle"
    image_source_url: internal
    license: original
    attribution: "그곳지금 기획"
    why_this_place_ko: "화면에서는 고대의 공간처럼 보이지만 실제로 가면 바다 한가운데 산 정상의 오래된 성채다. 영화가 장소의 시대를 완전히 바꿔버리는 순간을 확인할 수 있다."
    status: PLANNER_READY

  - scene_id: breakingbad-scene-01
    work_id: breakingbad
    context_type: SCREEN_SCENE
    source_location_id: lospollos
    link_mode: MAP_OR_PLACE
    scene_title_ko: "구스의 치킨집, 현실에서는 Twisters"
    scene_description_ko: "Los Pollos Hermanos의 외관과 식당 장면은 앨버커키의 실제 Twisters에서 촬영됐다. 가상의 범죄 세계와 지금도 영업하는 식당이 가장 자연스럽게 겹치는 장소다."
    relationship: FILMED
    image_path: /assets/scenes/breakingbad/breakingbad-scene-01.svg
    image_type: original_illustration
    alt_ko: "앨버커키 Twisters 식당 외관 분위기를 표현한 에디토리얼 일러스트"
    fact_sources:
      - "site/contentmap_breakingbad_locations.js#lospollos"
      - "docs/growth/story-scene/SCENE_PACKAGE_RESEARCH_15_V1.md"
    image_source_url: internal
    license: original
    attribution: "그곳지금 기획"
    why_this_place_ko: "간판은 현실의 식당인데 팬 눈에는 바로 Los Pollos Hermanos로 보인다. 세트가 철거된 곳이 아니라 실제 일상이 계속된다는 점 때문에 더 이상하다."
    status: PLANNER_READY

  - scene_id: breakingbad-scene-02
    work_id: breakingbad
    context_type: SCREEN_SCENE
    source_location_id: carwash
    link_mode: MAP_OR_PLACE
    scene_title_ko: "돈세탁 사업장이 된 평범한 세차장"
    scene_description_ko: "월터와 스카일러의 A1A 세차장으로 등장한 실제 앨버커키 세차장은 범죄의 돈이 일상적인 사업장에 숨어드는 설정을 현실 공간으로 만든다."
    relationship: FILMED
    image_path: /assets/scenes/breakingbad/breakingbad-scene-02.svg
    image_type: original_illustration
    alt_ko: "브레이킹 배드의 A1A 세차장 촬영지를 표현한 에디토리얼 일러스트"
    fact_sources:
      - "site/contentmap_breakingbad_locations.js#carwash"
      - "docs/growth/story-scene/SCENE_PACKAGE_RESEARCH_15_V1.md"
    image_source_url: internal
    license: original
    attribution: "그곳지금 기획"
    why_this_place_ko: "엄청난 사건 현장보다 오히려 평범해서 더 《Breaking Bad》답다. 차를 타고 지나가다 보면 ‘저기가 그곳이라고?’ 싶은 현실감이 있다."
    status: PLANNER_READY

